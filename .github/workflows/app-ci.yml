# Generated by cicd-bootstrap. Review before merging.
name: CI
'on':
  push:
    branches:
    - main
    paths-ignore:
    - .github/**
    - .harness/**
    - '**.md'
  pull_request:
    paths-ignore:
    - .github/**
    - .harness/**
    - '**.md'
  workflow_dispatch: null
permissions:
  contents: read
  packages: write
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Build
      run: |-
        dotnet restore
        dotnet build --configuration Release --no-restore
    - name: Test
      run: |
        cat > coverlet.runsettings <<'EOF'
        <RunSettings><DataCollectionRunSettings><DataCollectors><DataCollector friendlyName="XPlat Code Coverage"><Configuration><Format>opencover</Format></Configuration></DataCollector></DataCollectors></DataCollectionRunSettings></RunSettings>
        EOF
        dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" --settings coverlet.runsettings --results-directory ./TestResults
    - name: 'Sonar: set up JDK'
      if: ${{ env.SONAR_TOKEN != '' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: 'Sonar: install scanner'
      if: ${{ env.SONAR_TOKEN != '' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet tool install --global dotnet-sonarscanner
    - name: Sonar scan begin
      if: ${{ env.SONAR_TOKEN != '' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet-sonarscanner begin /k:"Komali612_netcore-ci-sandbox" /o:"komali612" /d:sonar.host.url="https://sonarcloud.io" /d:sonar.token="$SONAR_TOKEN" /d:sonar.qualitygate.wait=false /d:sonar.exclusions="**/.github/**,**/Program.cs" /d:sonar.cs.opencover.reportsPaths="**/coverage.opencover.xml"
    - name: Sonar build
      if: ${{ env.SONAR_TOKEN != '' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet build --configuration Release
    - name: Sonar scan end
      if: ${{ env.SONAR_TOKEN != '' }}
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet-sonarscanner end /d:sonar.token="$SONAR_TOKEN"
    - name: Log in to GHCR (Push)
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push image (Push)
      if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        tags: ghcr.io/komali612/netcore-ci-sandbox:${{ github.sha }}
